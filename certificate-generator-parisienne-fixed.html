<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&family=Parisienne&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1628;
    --navy-mid: #112240;
    --gold: #c9a84c;
    --gold-light: #e8cc7a;
    --white: #ffffff;
    --text: #e8edf5;
    --muted: #7a8ba8;
    --border: rgba(201,168,76,0.25);
    --radius: 16px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--navy);
    color: var(--text);
    font-family: 'Lato', sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px 80px;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(26,58,107,0.6) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 90% 90%, rgba(201,168,76,0.05) 0%, transparent 60%);
  }
  header { text-align:center; margin-bottom:44px; animation: fadeDown 0.6s ease both; }
  .logo-row { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:6px; }
  .logo-icon {
    width:40px; height:40px; border-radius:10px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    display:flex; align-items:center; justify-content:center; font-size:20px;
    box-shadow: 0 4px 20px rgba(201,168,76,0.35);
  }
  h1 {
    font-family:'Cinzel',serif; font-size:clamp(20px,4vw,32px); font-weight:700;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    letter-spacing:0.04em;
  }
  .subtitle { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; font-weight:300; }
  .card {
    background: var(--navy-mid); border:1px solid var(--border);
    border-radius: var(--radius); padding:32px 36px;
    width:100%; max-width:580px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    animation: fadeUp 0.6s ease 0.1s both;
  }
  .section-label {
    font-family:'Cinzel',serif; font-size:10px; text-transform:uppercase;
    letter-spacing:0.14em; color:var(--gold); margin-bottom:16px;
  }
  .field-label {
    font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.1em; color:var(--muted); margin-bottom:8px;
  }
  input[type=text] {
    width:100%; padding:13px 16px;
    background:rgba(10,22,40,0.7); border:1.5px solid rgba(201,168,76,0.25);
    border-radius:10px; color:var(--white);
    font-family:'Lato',sans-serif; font-size:16px; outline:none;
    transition:border-color 0.2s; margin-bottom:24px;
  }
  input[type=text]:focus { border-color:var(--gold); }
  input[type=text]::placeholder { color:var(--muted); }
  .cert-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px; }
  .cert-option {
    border:2px solid rgba(201,168,76,0.2); border-radius:12px;
    padding:12px 10px; cursor:pointer; transition:all 0.2s;
    background:rgba(10,22,40,0.5);
  }
  .cert-option:hover { border-color:rgba(201,168,76,0.5); background:rgba(201,168,76,0.05); }
  .cert-option.selected { border-color:var(--gold); background:rgba(201,168,76,0.1); }
  .cert-thumb { width:100%; height:52px; border-radius:6px; object-fit:cover; object-position:top; margin-bottom:6px; }
  .cert-tag { font-size:9px; text-transform:uppercase; letter-spacing:0.1em; color:var(--gold); font-weight:700; }
  .cert-title { font-size:12px; font-weight:700; color:var(--text); line-height:1.3; margin-top:2px; }
  .gen-btn {
    width:100%; padding:15px;
    background:linear-gradient(135deg,var(--gold),var(--gold-light));
    color:var(--navy); border:none; border-radius:10px;
    font-family:'Cinzel',serif; font-size:13px; font-weight:700;
    letter-spacing:0.08em; cursor:pointer; transition:all 0.2s;
    opacity:0.4; pointer-events:none;
  }
  .gen-btn.active { opacity:1; pointer-events:all; box-shadow:0 6px 24px rgba(201,168,76,0.35); }
  .gen-btn.active:hover { transform:translateY(-2px); box-shadow:0 10px 32px rgba(201,168,76,0.45); }
  #preview-section {
    display:none; width:100%; max-width:780px;
    margin-top:32px; animation:fadeUp 0.5s ease both;
  }
  .preview-label {
    font-family:'Cinzel',serif; font-size:10px; text-transform:uppercase;
    letter-spacing:0.14em; color:var(--gold); margin-bottom:14px; text-align:center;
  }
  #preview-canvas { width:100%; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,0.5); display:block; }
  .dl-btn {
    display:block; width:100%; max-width:340px;
    margin:18px auto 0; padding:14px;
    background:var(--navy-mid); border:1.5px solid var(--gold);
    color:var(--gold); border-radius:10px;
    font-family:'Cinzel',serif; font-size:12px; font-weight:700;
    letter-spacing:0.1em; cursor:pointer; text-align:center;
    text-decoration:none; transition:all 0.2s;
  }
  .dl-btn:hover { background:rgba(201,168,76,0.1); transform:translateY(-2px); }
  @keyframes fadeDown { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeUp   { from{opacity:0;transform:translateY(20px)}  to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>

<header>
  <div class="logo-row">
    <div class="logo-icon">🏅</div>
    <h1>Certificate Generator</h1>
  </div>
  <p class="subtitle">Certificate of Recognition</p>
</header>

<div class="card">
  <div class="field-label">Recipient's Name</div>
  <input type="text" id="name-input" placeholder="e.g. Jane Smith"
    oninput="updateBtn()" onkeydown="if(event.key==='Enter')generate()">

  <div class="section-label">Choose Certificate Type</div>
  <div class="cert-grid" id="cert-grid"></div>

  <button class="gen-btn" id="gen-btn" onclick="generate()">✦ Generate Certificate</button>
</div>

<div id="preview-section">
  <div class="preview-label">Preview — Click download to save</div>
  <canvas id="preview-canvas"></canvas>
  <a class="dl-btn" id="dl-btn" download="certificate.jpg">⬇ Download Certificate</a>
</div>

};

const CERTS = [
  { key:'associate',   label:'Associate Researcher'  },
  { key:'chapter',     label:'Chapter Leader'         },
  { key:'independent', label:'Independent Researcher' },
  { key:'lead',        label:'Lead Researcher'        },
];

let selectedCert = null;
const images = {};

CERTS.forEach(c => {
  const img = new Image();
  img.src = CERT_DATA[c.key];
  images[c.key] = img;
});

function buildGrid() {
  const grid = document.getElementById('cert-grid');
  grid.innerHTML = '';
  CERTS.forEach(c => {
    const div = document.createElement('div');
    div.className = 'cert-option' + (selectedCert === c.key ? ' selected' : '');
    div.onclick = () => selectCert(c.key);
    div.innerHTML = `
      <img class="cert-thumb" src="${CERT_DATA[c.key]}" alt="${c.label}">
      <div class="cert-tag">Certificate</div>
      <div class="cert-title">${c.label}</div>`;
    grid.appendChild(div);
  });
}

function selectCert(key) {
  selectedCert = key;
  buildGrid();
  updateBtn();
}

function updateBtn() {
  const name = document.getElementById('name-input').value.trim();
  document.getElementById('gen-btn').classList.toggle('active', name.length > 0 && selectedCert !== null);
}

async function generate() {
  await document.fonts.load("54px Parisienne");
  await document.fonts.ready;
  const name = document.getElementById('name-input').value.trim();
  if (!name || !selectedCert) return;

  const tmpl   = images[selectedCert];
  const canvas = document.getElementById('preview-canvas');
  const ctx    = canvas.getContext('2d');

  const doRender = () => {
    canvas.width  = tmpl.naturalWidth;
    canvas.height = tmpl.naturalHeight;
    ctx.drawImage(tmpl, 0, 0);

    const W = canvas.width, H = canvas.height;
    const nameY = SETTINGS.yPositions[selectedCert];
    const maxW  = W * 0.72;

    let fontSize = SETTINGS.fontSize;
    ctx.font = `${fontSize}px ${SETTINGS.font}`;
    while (ctx.measureText(name).width > maxW && fontSize > 20) {
      fontSize -= 2;
      ctx.font = `${fontSize}px ${SETTINGS.font}`;
    }

    const tw = ctx.measureText(name).width;
    const x  = (W - tw) / 2;
    const y  = H * nameY;

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.15)';
    ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2; ctx.shadowBlur = 5;
    ctx.fillStyle = SETTINGS.color;
    ctx.fillText(name, x, y);
    ctx.restore();

    const preview = document.getElementById('preview-section');
    preview.style.display = 'block';
    preview.scrollIntoView({ behavior:'smooth', block:'start' });

    const safeName = name.replace(/\s+/g,'_');
    const certLabel = CERTS.find(c => c.key === selectedCert).label.replace(/\s+/g,'_');
    const dlBtn = document.getElementById('dl-btn');
    dlBtn.download = `${safeName}_${certLabel}.jpg`;
    canvas.toBlob(blob => { dlBtn.href = URL.createObjectURL(blob); }, 'image/jpeg', 0.95);
  };

  if (tmpl.complete) doRender();
  else tmpl.onload = doRender;
}

buildGrid();
</script>
