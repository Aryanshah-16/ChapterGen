<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter Leader Certificate</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&family=Parisienne&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1628; --navy-mid: #112240;
    --gold: #c9a84c; --gold-light: #e8cc7a;
    --white: #ffffff; --text: #e8edf5;
    --muted: #7a8ba8; --border: rgba(201,168,76,0.25);
    --radius: 16px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--navy); color: var(--text);
    font-family: 'Lato', sans-serif; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px 80px;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(26,58,107,0.6) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 90% 90%, rgba(201,168,76,0.05) 0%, transparent 60%);
  }
  header { text-align:center; margin-bottom:44px; animation: fadeDown 0.6s ease both; }
  .logo-row { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:6px; }
  .logo-icon {
    width:40px; height:40px; border-radius:10px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    display:flex; align-items:center; justify-content:center; font-size:20px;
    box-shadow: 0 4px 20px rgba(201,168,76,0.35);
  }
  h1 {
    font-family:'Cinzel',serif; font-size:clamp(18px,3.5vw,28px); font-weight:700;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    letter-spacing:0.04em;
  }
  .subtitle { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; font-weight:300; margin-top:4px; }
  .card {
    background: var(--navy-mid); border:1px solid var(--border);
    border-radius: var(--radius); padding:32px 36px;
    width:100%; max-width:520px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    animation: fadeUp 0.6s ease 0.1s both;
  }
  .cert-preview {
    width:100%; border-radius:10px; margin-bottom:24px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3); display:block;
  }
  .field-label {
    font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.1em; color:var(--muted); margin-bottom:8px;
  }
  input[type=text] {
    width:100%; padding:13px 16px;
    background:rgba(10,22,40,0.7); border:1.5px solid rgba(201,168,76,0.25);
    border-radius:10px; color:var(--white);
    font-family:'Lato',sans-serif; font-size:16px; outline:none;
    transition:border-color 0.2s; margin-bottom:20px;
  }
  input[type=text]:focus { border-color:var(--gold); }
  input[type=text]::placeholder { color:var(--muted); }
  .gen-btn {
    width:100%; padding:15px;
    background:linear-gradient(135deg,var(--gold),var(--gold-light));
    color:var(--navy); border:none; border-radius:10px;
    font-family:'Cinzel',serif; font-size:13px; font-weight:700;
    letter-spacing:0.08em; cursor:pointer; transition:all 0.2s;
    opacity:0.4; pointer-events:none;
  }
  .gen-btn.active { opacity:1; pointer-events:all; box-shadow:0 6px 24px rgba(201,168,76,0.35); }
  .gen-btn.active:hover { transform:translateY(-2px); box-shadow:0 10px 32px rgba(201,168,76,0.45); }
  #preview-section {
    display:none; width:100%; max-width:780px;
    margin-top:32px; animation:fadeUp 0.5s ease both;
  }
  .preview-label {
    font-family:'Cinzel',serif; font-size:10px; text-transform:uppercase;
    letter-spacing:0.14em; color:var(--gold); margin-bottom:14px; text-align:center;
  }
  #preview-canvas { width:100%; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,0.5); display:block; }
  .dl-btn {
    display:block; width:100%; max-width:340px;
    margin:18px auto 0; padding:14px;
    background:var(--navy-mid); border:1.5px solid var(--gold);
    color:var(--gold); border-radius:10px;
    font-family:'Cinzel',serif; font-size:12px; font-weight:700;
    letter-spacing:0.1em; text-align:center;
    text-decoration:none; transition:all 0.2s; display:block;
  }
  .dl-btn:hover { background:rgba(201,168,76,0.1); transform:translateY(-2px); }
  @keyframes fadeDown { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeUp   { from{opacity:0;transform:translateY(20px)}  to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>

  <div class="field-label">Recipient Name</div>
  <input type="text" id="name-input" placeholder="Enter full name..." autocomplete="off">
  
  <button class="gen-btn" id="generate-btn">Generate Certificate</button>
</div>

<div id="preview-section">
  <p class="preview-label">Official Live Preview</p>
  <canvas id="preview-canvas"></canvas>
  <a href="#" class="dl-btn" id="download-btn" download="Certificate.png">Download PNG Certificate</a>
</div>

<script>
  const FONT = 'Cinzel';
  const FONT_SIZE = 42;
  const COLOR = '#c9a84c';
  const NAME_Y = 0.54;

  const input = document.getElementById('name-input');
  const btn = document.getElementById('generate-btn');

  input.addEventListener('input', () => {
    if (input.value.trim().length > 0) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });

  btn.addEventListener('click', async () => {
    // Dynamic canvas creation using template image path
    const tmpl = new Image();
    
    // CRITICAL FOR GITHUB PAGES HOSTING: Enables structural CORS access to local scope context
    tmpl.crossOrigin = "anonymous";
    tmpl.src = 'certificate-template.jpg'; 

    await new Promise((resolve, reject) => {
      tmpl.onload = resolve;
      tmpl.onerror = () => {
        console.warn("Local asset template image could not load. Falling back to base64 structural context framework layout target...");
        tmpl.src = document.getElementById('cert-base64-view').src;
        tmpl.onload = resolve;
      };
    });

    // Ensure system rendering mechanism can find global window layout fonts
    await document.fonts.ready;

    const name = input.value.trim();
    if (!name) return;

    const canvas = document.getElementById('preview-canvas');
    const ctx = canvas.getContext('2d');

    canvas.width  = tmpl.naturalWidth || 800; 
    canvas.height = tmpl.naturalHeight || 565;
    ctx.drawImage(tmpl, 0, 0);

    const W = canvas.width;
    const H = canvas.height;
    const maxW = W * 0.72;

    let fontSize = FONT_SIZE;
    ctx.font = fontSize + 'px ' + FONT;
    while (ctx.measureText(name).width > maxW && fontSize > 20) {
      fontSize -= 2;
      ctx.font = fontSize + 'px ' + FONT;
    }

    const tw = ctx.measureText(name).width;
    const x  = (W - tw) / 2;
    const y  = H * NAME_Y;

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.15)';
    ctx.shadowOffsetX = 2; 
    ctx.shadowOffsetY = 2; 
    ctx.shadowBlur = 5;
    ctx.fillStyle = COLOR;
    ctx.fillText(name, x, y);
    ctx.restore();

    const preview = document.getElementById('preview-section');
    preview.style.display = 'block';
    preview.scrollIntoView({ behavior:'smooth', block:'start' });

    const dlBtn = document.getElementById('download-btn');
    dlBtn.href = canvas.toDataURL('image/png');
  });
</script>
</body>
</html>
